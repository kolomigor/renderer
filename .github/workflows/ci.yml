name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev
      - review

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --target renderer renderer_tests

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release
